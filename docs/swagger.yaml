basePath: /
definitions:
  handlers.ProbeConfig:
    properties:
      bootDelaySeconds:
        description: 'Startup only: wall-clock seconds from process start before a
          success is allowed.'
        type: number
      delaySeconds:
        description: sleep before answering (0–30)
        type: number
      flapEvery:
        type: integer
      flapSeconds:
        description: |-
          Flap (mode=flap):
            flapSeconds — wall-clock half-period: ok for N sec, fail for N sec, repeat (default 5).
            flapEvery   — if > 0, every Nth request fails instead of using the clock (handy for tests).
        type: number
      mode:
        description: ok | fail | delay | flap
        type: string
    type: object
  handlers.ProbeSnapshot:
    properties:
      live:
        $ref: '#/definitions/handlers.ProbeConfig'
      liveFlapPhase:
        description: Which half of a time-based flap we are in right now (ok|fail|n/a).
        type: string
      ready:
        $ref: '#/definitions/handlers.ProbeConfig'
      readyFlapPhase:
        type: string
      startup:
        $ref: '#/definitions/handlers.ProbeConfig'
      startupFlapPhase:
        type: string
      startupLatched:
        type: boolean
      startupWouldPass:
        type: boolean
      uptimeSeconds:
        type: number
    type: object
  handlers.ProbeUpdate:
    properties:
      live:
        $ref: '#/definitions/handlers.ProbeConfig'
      ready:
        $ref: '#/definitions/handlers.ProbeConfig'
      resetStartupLatch:
        type: boolean
      startup:
        $ref: '#/definitions/handlers.ProbeConfig'
    type: object
info:
  contact: {}
  description: Drop-in HTTP util for testing probes, routing, headers, env/params
    and more in a cluster. Swagger "Try it out" uses the host you opened the UI on
    (or override with ?host=host:port&scheme=http on /api-docs/index.html). Authorize
    with Bearer token from logs or AUTH_TOKEN.
  title: Cluster Util API
  version: "2.0"
paths:
  /a/control/probes:
    get:
      description: Current live/ready/startup config + startup latch + flap phase
        + uptime
      operationId: getProbes
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProbeSnapshot'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get probe control state
    put:
      consumes:
      - application/json
      description: Partial update of live/ready/startup. resetStartupLatch re-runs
        cold start without restarting the process.
      operationId: putProbes
      parameters:
      - description: probe update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ProbeUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProbeSnapshot'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update probe control state
  /a/env:
    get:
      description: Env dump so you can check secrets/configmaps/task params actually
        landed. Behind auth under /a/
      operationId: env
      parameters:
      - default: Bearer
        description: Bearer token from app logs
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get environment variables
  /debug:
    get:
      description: Hostname, client ip, headers, uri — good for routing tests
      operationId: debug
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Debug
  /delay/{seconds}:
    get:
      description: Sleep N seconds (max 30) then return 200. For probe timeouts prefer
        LIVE/READY/STARTUP delaySeconds instead
      operationId: delay
      parameters:
      - description: seconds to sleep (max 30)
        in: path
        name: seconds
        required: true
        type: number
      produces:
      - text/plain
      responses:
        "200":
          description: delayed
          schema:
            type: string
      summary: Delay then OK
  /echo:
    delete:
      consumes:
      - text/plain
      description: Bounce method, path, query, headers and body back as json
      operationId: echo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Echo request
    get:
      consumes:
      - text/plain
      description: Bounce method, path, query, headers and body back as json
      operationId: echo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Echo request
    patch:
      consumes:
      - text/plain
      description: Bounce method, path, query, headers and body back as json
      operationId: echo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Echo request
    post:
      consumes:
      - text/plain
      description: Bounce method, path, query, headers and body back as json
      operationId: echo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Echo request
    put:
      consumes:
      - text/plain
      description: Bounce method, path, query, headers and body back as json
      operationId: echo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Echo request
  /headers:
    get:
      description: Headers as seen by the app (handy behind ingress/ALB)
      operationId: headers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get headers
  /help:
    get:
      description: Quick map of useful routes
      operationId: help
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Help
  /livez:
    get:
      description: 'Kube liveness. 200 = fine; 503 = restart. Modes: ok|fail|delay|flap.
        LIVE_* env or /a/control/probes. Aliases: /healthz /health'
      operationId: livez
      parameters:
      - description: one-shot force fail with 0/false (curl only)
        in: query
        name: ok
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: ok
          schema:
            type: string
        "503":
          description: unhealthy
          schema:
            type: string
      summary: Liveness (livez)
  /metrics:
    get:
      description: Prometheus scrape endpoint
      operationId: metrics
      produces:
      - text/plain
      responses:
        "200":
          description: metrics
          schema:
            type: string
      summary: Prometheus metrics
  /ping:
    get:
      description: Simple alive check (not a kube probe — use /livez for that)
      operationId: ping
      produces:
      - text/plain
      responses:
        "200":
          description: PONG
          schema:
            type: string
      summary: Get ping
  /readyz:
    get:
      description: 'Kube readiness. 200 = take traffic; 503 = leave Service endpoints.
        Modes: ok|fail|delay|flap. Alias: /ready'
      operationId: readyz
      parameters:
      - description: one-shot force fail (curl only)
        in: query
        name: ok
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: ready
          schema:
            type: string
        "503":
          description: not ready
          schema:
            type: string
      summary: Readiness (readyz)
  /startupz:
    get:
      description: 'Cold start latch: 503 until bootDelay, then sticky 200. mode=fail
        never latches. mode=flap oscillates until a success latches (or forever if
        you only hit fail phases — use flap carefully here).'
      operationId: startupz
      produces:
      - text/plain
      responses:
        "200":
          description: started
          schema:
            type: string
        "503":
          description: starting
          schema:
            type: string
      summary: Startup (startupz)
  /status/{code}:
    get:
      description: Respond with whatever http status you pass (100-599). Great for
        ingress/retry testing
      operationId: status
      parameters:
      - description: HTTP status code
        in: path
        name: code
        required: true
        type: integer
      produces:
      - text/plain
      responses:
        "200":
          description: status body
          schema:
            type: string
      summary: Fixed status code
  /version:
    get:
      description: What binary is running in this env
      operationId: version
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Version / build info
securityDefinitions:
  BearerAuth:
    description: 'Paste: Bearer <token>  (token from container logs, or AUTH_TOKEN
      env). Example: Bearer dev'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
