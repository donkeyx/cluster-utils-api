basePath: /
definitions:
  handlers.ProbeConfig:
    properties:
      bootDelaySeconds:
        description: |-
          Startup only: wall-clock seconds from process start before a success is allowed.
          Simulates real cold start — kube keeps hitting startup until this elapses (or control forces ok).
        type: number
      delaySeconds:
        description: sleep before answering (0–30)
        type: number
      mode:
        description: ok | fail | delay
        type: string
    type: object
  handlers.ProbeSnapshot:
    properties:
      live:
        $ref: '#/definitions/handlers.ProbeConfig'
      ready:
        $ref: '#/definitions/handlers.ProbeConfig'
      startup:
        $ref: '#/definitions/handlers.ProbeConfig'
      startupLatched:
        type: boolean
      startupWouldPass:
        description: True when startup would succeed *right now* (after boot delay
          / latch rules).
        type: boolean
      uptimeSeconds:
        type: number
    type: object
  handlers.ProbeUpdate:
    properties:
      live:
        $ref: '#/definitions/handlers.ProbeConfig'
      ready:
        $ref: '#/definitions/handlers.ProbeConfig'
      resetStartupLatch:
        description: Clear the startup latch so the next checks behave like a fresh
          process again.
        type: boolean
      startup:
        $ref: '#/definitions/handlers.ProbeConfig'
    type: object
host: localhost:8080
info:
  contact: {}
  description: Drop-in HTTP util for testing probes, routing, headers, env/params
    and more in a cluster
  title: Cluster Util API
  version: "2.0"
paths:
  /a/control/probes:
    get:
      description: Current live/ready/startup config + startup latch + uptime
      operationId: getProbes
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProbeSnapshot'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get probe control state
    put:
      consumes:
      - application/json
      description: Partial update of live/ready/startup. Use resetStartupLatch to
        re-run cold start without restarting the process.
      operationId: putProbes
      parameters:
      - description: probe update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ProbeUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProbeSnapshot'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update probe control state
  /a/env:
    get:
      description: Env dump so you can check secrets/configmaps/task params actually
        landed. Behind auth under /a/
      operationId: env
      parameters:
      - default: Bearer
        description: Bearer token from app logs
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get environment variables
  /debug:
    get:
      description: Hostname, client ip, headers, uri — good for routing tests
      operationId: debug
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Debug
  /delay/{seconds}:
    get:
      description: Sleep N seconds (max 30) then return 200. For probe timeouts prefer
        LIVE/READY/STARTUP delaySeconds instead
      operationId: delay
      parameters:
      - description: seconds to sleep (max 30)
        in: path
        name: seconds
        required: true
        type: number
      produces:
      - text/plain
      responses:
        "200":
          description: delayed
          schema:
            type: string
      summary: Delay then OK
  /echo:
    delete:
      consumes:
      - text/plain
      description: Bounce method, path, query, headers and body back as json
      operationId: echo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Echo request
    get:
      consumes:
      - text/plain
      description: Bounce method, path, query, headers and body back as json
      operationId: echo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Echo request
    patch:
      consumes:
      - text/plain
      description: Bounce method, path, query, headers and body back as json
      operationId: echo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Echo request
    post:
      consumes:
      - text/plain
      description: Bounce method, path, query, headers and body back as json
      operationId: echo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Echo request
    put:
      consumes:
      - text/plain
      description: Bounce method, path, query, headers and body back as json
      operationId: echo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Echo request
  /headers:
    get:
      description: Headers as seen by the app (handy behind ingress/ALB)
      operationId: headers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get headers
  /help:
    get:
      description: Quick map of useful routes
      operationId: help
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Help
  /livez:
    get:
      description: 'Kube liveness style. 200 = process fine; 503 = kube will restart.
        Config via LIVE_MODE/LIVE_DELAY or /a/control/probes. Aliases: /healthz /health'
      operationId: livez
      parameters:
      - description: one-shot force fail with 0/false (curl only; kube does not send
          this)
        in: query
        name: ok
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: ok
          schema:
            type: string
        "503":
          description: unhealthy
          schema:
            type: string
      summary: Liveness (livez)
  /metrics:
    get:
      description: Prometheus scrape endpoint
      operationId: metrics
      produces:
      - text/plain
      responses:
        "200":
          description: metrics
          schema:
            type: string
      summary: Prometheus metrics
  /ping:
    get:
      description: Simple alive check (not a kube probe — use /livez for that)
      operationId: ping
      produces:
      - text/plain
      responses:
        "200":
          description: PONG
          schema:
            type: string
      summary: Get ping
  /readyz:
    get:
      description: 'Kube readiness style. 200 = take traffic; 503 = drop from Service
        endpoints (no restart). READY_MODE/READY_DELAY or control API. Alias: /ready'
      operationId: readyz
      parameters:
      - description: one-shot force fail (curl only)
        in: query
        name: ok
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: ready
          schema:
            type: string
        "503":
          description: not ready
          schema:
            type: string
      summary: Readiness (readyz)
  /startupz:
    get:
      description: 'Real startup semantics: fails until boot delay elapses, then latches
        success until process restart or resetStartupLatch. After latch, always 200
        (fast) so kube stops startup probes. Mode=fail never latches.'
      operationId: startupz
      produces:
      - text/plain
      responses:
        "200":
          description: started
          schema:
            type: string
        "503":
          description: starting
          schema:
            type: string
      summary: Startup (startupz)
  /status/{code}:
    get:
      description: Respond with whatever http status you pass (100-599). Great for
        ingress/retry testing
      operationId: status
      parameters:
      - description: HTTP status code
        in: path
        name: code
        required: true
        type: integer
      produces:
      - text/plain
      responses:
        "200":
          description: status body
          schema:
            type: string
      summary: Fixed status code
  /version:
    get:
      description: What binary is running in this env
      operationId: version
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Version / build info
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the token from the app logs
      on startup (or AUTH_TOKEN env).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
