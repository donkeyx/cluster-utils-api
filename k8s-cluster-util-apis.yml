apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-utils-api
  labels:
    app: cluster-utils
    type: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-utils
      type: api
  template:
    metadata:
      labels:
        app: cluster-utils
        type: api
    spec:
      containers:
        - name: cluster-utils-api
          image: donkeyx/cluster-utils-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          env:
            - name: PORT
              value: "8080"
            # flip these to exercise probe behaviour:
            # - name: READY
            #   value: "false"
            # - name: HEALTHY
            #   value: "false"
            # - name: AUTH_TOKEN
            #   value: "fixed-token-for-tests"
          resources:
            requests:
              cpu: "0.1"
              memory: "50Mi"
            limits:
              cpu: "0.5"
              memory: 100Mi

---
apiVersion: v1
kind: Service
metadata:
  name: cluster-utils-api-svc
  labels:
    app: cluster-utils
    type: api
spec:
  selector:
    app: cluster-utils
    type: api
  ports:
    - name: http
      port: 8080
      targetPort: http
