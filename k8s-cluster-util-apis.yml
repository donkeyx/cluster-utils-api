apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-utils-api
  labels:
    app: cluster-utils
    type: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-utils
      type: api
  template:
    metadata:
      labels:
        app: cluster-utils
        type: api
    spec:
      containers:
        - name: cluster-utils-api
          # GHCR primary (Hub still works as mirror). Version tag → default pull IfNotPresent.
          # :latest still forces Always in kube even without imagePullPolicy.
          image: ghcr.io/donkeyx/cluster-utils-api:2.5.0
          # Alternative: docker.io/donkeyx/cluster-utils-api:2.5.0
          ports:
            - name: http
              containerPort: 8080
          # Probes — close to kube defaults; short timeout so app delaySeconds demos work.
          # Defaults if omitted: periodSeconds=10, timeoutSeconds=1, successThreshold=1,
          # failureThreshold=3, initialDelaySeconds=0.
          #
          # startup: only until first success, then live+ready take over.
          #   period 2 × failureThreshold 30 ≈ 60s max cold-start window.
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
            successThreshold: 1
          # liveness: restart if process is wedged (defaults are fine for this app)
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          # readiness: leave Service endpoints if not ready (~30s of fails with defaults)
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          env:
            - name: PORT
              value: "8080"
            # --- probe demos (uncomment what you want to break) ---
            # cold start: stay "starting" for 15s then latch
            # - name: STARTUP_BOOT_DELAY
            #   value: "15"
            # fail readiness (pod stays up, leaves Service endpoints)
            # - name: READY_MODE
            #   value: "fail"
            # flap readiness (in/out of endpoints)
            # - name: READY_MODE
            #   value: "flap"
            # - name: READY_FLAP_SECONDS
            #   value: "5"
            # slow readiness → probe timeout (timeoutSeconds: 1)
            # - name: READY_MODE
            #   value: "delay"
            # - name: READY_DELAY
            #   value: "3"
            # fail liveness → restarts
            # - name: LIVE_MODE
            #   value: "fail"
            # flap liveness (restart thrash — careful)
            # - name: LIVE_MODE
            #   value: "flap"
            # - name: LIVE_FLAP_SECONDS
            #   value: "10"
            # - name: AUTH_TOKEN
            #   value: "fixed-token-for-tests"
            # --- OTEL traces (OTLP *push* to Alloy → Tempo; not scraped) ---
            # - name: OTEL_SERVICE_NAME
            #   value: cluster-utils-api
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: alloy.observability.svc.cluster.local:4318
            # - name: OTEL_EXPORTER_OTLP_PROTOCOL
            #   value: http/protobuf
            # - name: OTEL_EXPORTER_OTLP_INSECURE
            #   value: "true"
            # include kube probe paths in traces (off by default — noisy)
            # - name: OTEL_TRACE_PROBES
            #   value: "true"
          # Sized from podman run of :2.5.0 (idle~14–15Mi cgroup, process_resident~40Mi,
          # CPU ~0.3–1% under light load). requests ≈ 90% of observed process RSS; limits headroom.
          resources:
            requests:
              cpu: "10m"
              memory: "36Mi"
            limits:
              cpu: "100m"
              memory: "80Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: cluster-utils-api-svc
  labels:
    app: cluster-utils
    type: api
spec:
  selector:
    app: cluster-utils
    type: api
  ports:
    - name: http
      port: 8080
      targetPort: http
